<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fish Game</title>
  <style>
    /* ── Reset & Root ──────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #0d1b2a;
      --panel:    rgba(12, 16, 36, 0.96);
      --accent:   #00d4ff;
      --gold:     #FFD700;
      --green:    #4CAF50;
      --red:      #EF5350;
      --text:     #ffffff;
      --text-dim: rgba(255,255,255,0.55);
      --border:   rgba(255,255,255,0.12);
      --safe-b:   env(safe-area-inset-bottom, 0px);
    }

    body {
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      image-rendering: pixelated;
    }

    /* ── HUD Top Bar ───────────────────────────────────────── */
    #hud-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 100%);
      pointer-events: none;
      z-index: 100;
    }

    .hud-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .hud-spacer { flex: 1; }

    /* ── HUD Bottom Nav ────────────────────────────────────── */
    #hud-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(72px + var(--safe-b));
      padding-bottom: var(--safe-b);
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 100%);
      z-index: 100;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 14px;
      opacity: 0.9;
      transition: transform 0.1s;
    }
    .nav-btn:active { transform: scale(0.9); }

    .nav-btn-icon {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(255,255,255,0.13);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
    }

    .nav-btn-main .nav-btn-icon {
      width: 62px; height: 62px;
      font-size: 26px;
      background: var(--accent);
      border-color: rgba(0,212,255,0.4);
      box-shadow: 0 4px 20px rgba(0,212,255,0.5), 0 0 0 4px rgba(0,212,255,0.15);
    }

    /* ── Inventory Panel ───────────────────────────────────── */
    #inventory-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 88vh;
      border-radius: 22px 22px 0 0;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 200;
      display: flex;
      flex-direction: column;
      /* Wood/parchment theme */
      background: linear-gradient(160deg, #F6EAD0 0%, #EDD9A0 55%, #E2CC84 100%);
      border-top: 3px solid #7B4A22;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,220,140,0.4);
      /* Re-scope CSS vars for all children */
      color: #2A1000;
      --accent:   #8B5A20;
      --gold:     #7B4A00;
      --green:    #3D7A1A;
      --red:      #C62828;
      --text:     #2A1000;
      --text-dim: rgba(42,16,0,0.55);
      --border:   rgba(90,50,20,0.22);
    }
    #inventory-panel.open { transform: translateY(0); }

    .panel-handle {
      width: 38px; height: 4px;
      background: rgba(90,50,20,0.28);
      border-radius: 2px;
      margin: 10px auto 0;
      cursor: pointer;
    }

    .panel-tabs {
      display: flex;
      padding: 6px 12px 0;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      background: rgba(139,90,43,0.07);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: none;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      border-bottom: 2.5px solid transparent;
      cursor: pointer;
      transition: all 0.18s;
      letter-spacing: 0.3px;
      margin-bottom: -1px;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      overscroll-behavior: contain;
    }
    .panel-content::-webkit-scrollbar { width: 4px; }
    .panel-content::-webkit-scrollbar-track { background: rgba(90,50,20,0.08); }
    .panel-content::-webkit-scrollbar-thumb { background: rgba(90,50,20,0.28); border-radius: 2px; }

    /* ── Fish Cards ────────────────────────────────────────── */
    .fish-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .fish-summary strong { color: var(--gold); }
    .sell-all-btn {
      margin-left: auto;
      background: rgba(76,175,80,0.2);
      color: var(--green);
      border: 1px solid var(--green);
      border-radius: 14px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .fish-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,248,220,0.65);
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }

    .fish-icon-img {
      width: 48px; height: 48px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .fish-info { flex: 1; min-width: 0; }
    .fish-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fish-detail { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    .fish-value { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .fish-coins { font-size: 12px; color: var(--gold); font-weight: 700; }
    .sell-btn {
      background: rgba(239,83,80,0.18);
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .sell-btn:active { background: rgba(239,83,80,0.35); }

    /* ── Equipment ─────────────────────────────────────────── */
    .equip-section { margin-bottom: 18px; }
    .equip-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .equip-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,248,220,0.65);
      border: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .equip-icon { font-size: 24px; }
    .equip-info { flex: 1; min-width: 0; }
    .equip-name { font-weight: 700; font-size: 14px; }
    .equip-stat { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .equip-actions { margin-left: auto; display: flex; align-items: center; flex-shrink: 0; }
    .equip-badge {
      font-size: 11px; font-weight: 700;
      color: var(--accent); border: 1px solid var(--accent);
      border-radius: 10px; padding: 3px 10px;
    }
    .equip-btn {
      font-size: 11px; font-weight: 700;
      color: var(--text-dim); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px 10px;
      background: none; cursor: pointer;
    }
    .equip-btn:active { background: rgba(255,255,255,0.1); }
    .equip-btn-disabled { opacity: 0.4; cursor: not-allowed; }
    .equip-empty { opacity: 0.6; }

    /* ── FishDex ───────────────────────────────────────────── */
    .dex-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .dex-count { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .dex-progress-bar {
      flex: 1;
      height: 8px;
      background: rgba(90,50,20,0.15);
      border-radius: 4px;
      overflow: hidden;
    }
    .dex-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.4s;
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
    }

    .dex-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 6px 8px;
      border-radius: 14px;
      background: rgba(255,248,220,0.65);
      border: 1px solid var(--border);
      text-align: center;
      gap: 4px;
    }
    .dex-card.caught { border-color: rgba(90,50,20,0.28); }
    .dex-card.uncaught { opacity: 0.5; filter: grayscale(0.8) sepia(0.3); }
    .dex-fish-img { width: 52px; height: 52px; }
    .dex-fish-name { font-size: 11px; font-weight: 700; line-height: 1.2; }
    .dex-fish-stat { font-size: 10px; color: var(--text-dim); }
    .rarity-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ── Empty state ───────────────────────────────────────── */
    .empty-msg {
      text-align: center;
      color: var(--text-dim);
      font-size: 16px;
      padding: 48px 0;
      line-height: 1.8;
    }
    .empty-msg span { font-size: 14px; }

    /* ── Character Customizer ─────────────────────────────── */
    .char-preview-wrap {
      display: flex;
      justify-content: center;
      padding: 10px 0 10px;
    }
    .char-preview-canvas {
      display: block;
      width: 200px;
      height: 175px;
      border-radius: 16px;
      background: rgba(255,248,220,0.85);
      border: 1.5px solid rgba(90,50,20,0.18);
      image-rendering: pixelated;
      touch-action: auto;
    }

    .char-section {
      margin-bottom: 16px;
    }
    .char-label {
      font-size: 12px;
      font-weight: 700;
      color: rgba(42,16,0,0.55);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .swatch-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
      outline: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.22);
      -webkit-tap-highlight-color: transparent;
    }
    .swatch:active { transform: scale(0.85); }
    .swatch-selected {
      border-color: #2A1000;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.75), 0 1px 4px rgba(0,0,0,0.22);
    }
    .char-hint {
      font-size: 11px;
      color: rgba(42,16,0,0.4);
      text-align: center;
      margin-top: 8px;
      font-style: italic;
    }

    /* ── Catch Toast ───────────────────────────────────────── */
    .catch-toast {
      position: fixed;
      top: 64px; left: 50%; transform: translateX(-50%) translateY(-12px);
      background: rgba(10,15,40,0.95);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 24px;
      border: 1.5px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 500;
    }
    .catch-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="diag" style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#ff6b6b;font-size:13px;font-family:monospace;text-align:center;padding:24px;z-index:9999;white-space:pre-wrap;pointer-events:none;"></div>
  <script>
    (function() {
      var diag = document.getElementById('diag');
      diag.textContent = 'Loading...';
      diag.style.color = '#888';
      function showErr(msg) {
        diag.style.color = '#ff6b6b';
        diag.style.pointerEvents = 'auto';
        diag.textContent = msg + '\n\nTap to reload';
        diag.onclick = function() { location.reload(); };
      }
      window.addEventListener('error', function(e) {
        showErr('ERROR: ' + e.message + '\n' + (e.filename || '').split('/').pop() + ':' + e.lineno);
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        showErr('MODULE ERROR:\n' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
